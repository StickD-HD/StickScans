# Lance les tests à chaque envoi sur GitHub (et sur les pull requests). En cas d'échec, GitHub prévient par mail.
# Aucune requête vers scan-manga ni AniList : les tests n'utilisent que des pages enregistrées.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
