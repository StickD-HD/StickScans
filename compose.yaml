services:
  app:
    build: .
    container_name: manhwa-tracker
    ports:
      - 8420:8000
    volumes:
      - ./data:/app/data
    environment:
      - BYPARR_URL=http://byparr:8191/v1
      # Authentification : laisse AUTH_PASSWORD vide pour la désactiver.
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      # Passe à true si l'app est servie en HTTPS (reverse proxy).
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
    depends_on:
      - byparr
    restart: unless-stopped

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: manhwa-byparr
    shm_size: '2gb'
    environment:
      - LOG_LEVEL=INFO
    restart: unless-stopped
