services:
  app:
    build: .
    container_name: manhwa-tracker
    ports:
      - 8420:8000
    volumes:
      - ./data:/app/data
    environment:
      - BYPARR_URL=http://byparr:8191/v1
      # Authentification : laisse AUTH_PASSWORD vide pour la désactiver.
      - AUTH_USERNAME=${AUTH_USERNAME:-admin}
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      # Passe à true si l'app est servie en HTTPS (reverse proxy).
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      # Vérifications à xx:00 (celles de l'instance de ton ami sont à xx:30).
      - CHECK_OFFSET_MINUTES=0
      # Pause entre deux séries pendant une vérification : 2 à 4 s (avant : 3 à 8 s).
      # Pour revenir à l'ancien rythme, supprime ces deux lignes.
      - CHECK_MIN_DELAY_SECONDS=2
      - CHECK_MAX_DELAY_SECONDS=4
    depends_on:
      - byparr
    restart: unless-stopped

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: manhwa-byparr
    shm_size: '2gb'
    environment:
      - LOG_LEVEL=INFO
    restart: unless-stopped
