x-app: &app
  image: ghcr.io/stickd-hd/stickscans:latest
  restart: unless-stopped
  depends_on:
    byparr:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/auth/status')"]
    interval: 30s
    timeout: 5s
    retries: 3

services:
  stickscans-1:
    <<: *app
    container_name: stickscans-1
    ports: ["8420:8000"]
    volumes:
      - ${DATA_DIR_1:?Définis DATA_DIR_1}:/app/data
      - cache:/app/cache
    environment:
      - AUTH_USERNAME=${USER_1:-admin}
      - AUTH_PASSWORD=${PASSWORD_1}
      - CHECK_OFFSET_MINUTES=0

  stickscans-2:
    <<: *app
    container_name: stickscans-2
    ports: ["8421:8000"]
    volumes:
      - ${DATA_DIR_2:?Définis DATA_DIR_2}:/app/data
      - cache:/app/cache
    environment:
      - AUTH_USERNAME=${USER_2:-admin}
      - AUTH_PASSWORD=${PASSWORD_2}
      - CHECK_OFFSET_MINUTES=30

  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    shm_size: 2gb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191/"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  cache:
